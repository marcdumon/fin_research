[project]
name = 'fin_research'
version = '0.1.0'
description = 'Autonomous equity research agent swarm over SEC filings'
requires-python = '>=3.13'
dependencies = [
    'duckdb>=1.5.4,<2',
    'httpx>=0.28',
    'lxml>=5.3',
    'pandas>=2.2',
    'pydantic>=2.11',
    'python-dotenv>=1.0',
]

[dependency-groups]
dev = [
    'pytest>=8.3',
    'pytest-asyncio>=0.25',
    'respx>=0.22',
    'ruff>=0.9',
]
notebook = [
    'ipykernel>=6.0.0',
    'notebook>=7.0.0',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/fin_research']

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-v --tb=short'
asyncio_mode = 'auto'

[tool.pyright]
include = ['src', 'tests']
pythonVersion = '3.13'
venvPath = '.'
venv = '.venv'
typeCheckingMode = 'standard'
